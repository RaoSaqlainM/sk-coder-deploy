server {
    listen 80;
    server_name admin.example.com;
    auth_basic "SK Coder Owner Dashboard";
    auth_basic_user_file /etc/nginx/sk-coder-owner.htpasswd;
    root /opt/sk-coder-backend/source/frontend/dist/public;
    index index.html;

    location /api/admin/ {
        proxy_pass http://127.0.0.1:3001/api/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/sk-coder-admin-token.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
