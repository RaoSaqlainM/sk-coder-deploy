services:
  runtime:
    build:
      context: ../runtime
    image: ${RUNTIME_IMAGE:-sk-coder-runtime:latest}
    command: ["true"]

  backend:
    build:
      context: ../backend
    env_file:
      - ../.env
    environment:
      PORT: 3001
      WORKSPACE_ROOT: /var/lib/sk-coder/workspaces
      WORKSPACE_METADATA_PATH: /var/lib/sk-coder/workspaces/.registry/workspaces.json
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACE_HOST_PATH:-/var/lib/sk-coder/workspaces}:/var/lib/sk-coder/workspaces
    depends_on:
      runtime:
        condition: service_completed_successfully
    restart: unless-stopped
